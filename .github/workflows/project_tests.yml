name: Project Tests

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
    paths-ignore:
      - "docs/docs/**"

permissions:
  contents: read

jobs:
  detect-mnn-changes:
    name: Detect MNN changes
    runs-on: ubuntu-24.04
    outputs:
      has-mnn-changes: ${{ steps.changes.outputs.has-mnn-changes }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test MNN change detection
        run: python3 scripts/test_mnn_change_detection.py
      - name: Check the complete change range
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # PRs include every branch commit; pushes include every commit in the push.
          # If history is unavailable (e.g. a force push), run the checks conservatively.
          has_mnn_changes=true
          reasons="$RUNNER_TEMP/mnn-change-reasons"
          : > "$reasons"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            head="$PR_HEAD_SHA"
            base=$(git merge-base "$PR_BASE_SHA" "$head") || base=''
          else
            head="$PUSH_HEAD_SHA"
            base="$PUSH_BASE_SHA"
          fi

          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] &&
             git diff --name-only --no-renames -z "$base" "$head" -- > "$RUNNER_TEMP/mnn-changed-paths"; then
            has_mnn_changes=false
            while IFS= read -r -d '' path; do
              case "$path" in
                scripts/test_mnn_change_detection.py)
                  ;;
                feature/mnn/*|scripts/mnn/*|scripts/*[Mm][Nn][Nn]*.py|docs/mnn.json|network/mnn-catalog.openapi.json)
                  has_mnn_changes=true
                  printf '%s\n' "$path (MNN-owned file)" >> "$reasons"
                  ;;
                */src/*Test*/*|*/src/test*/*)
                  # Shared Kotlin tests run in the main job, including MNN-named fixtures.
                  ;;
                */src/*Main/*[Mm][Nn][Nn]*|app/ios/*[Mm][Nn][Nn]*)
                  has_mnn_changes=true
                  printf '%s\n' "$path (MNN production source)" >> "$reasons"
                  ;;
                *.kt|*.kts|*.swift|*.toml|*.properties|*.pbxproj|*.plist|*/CMakeLists.txt|*.cmake)
                  # Shared code/build files count only when changed lines refer to MNN.
                  # Generic Gradle edits and unrelated iOS configuration do not rebuild MNN.
                  if ! git diff --quiet --no-renames -G '[Mm][Nn][Nn]' "$base" "$head" -- "$path"; then
                    has_mnn_changes=true
                    printf '%s\n' "$path (changed MNN reference)" >> "$reasons"
                  fi
                  ;;
              esac
            done < "$RUNNER_TEMP/mnn-changed-paths"
          else
            printf '%s\n' 'Change history unavailable; running MNN checks conservatively.' >> "$reasons"
          fi
          echo "has-mnn-changes=$has_mnn_changes" >> "$GITHUB_OUTPUT"
          echo "MNN changes in $base..$head: $has_mnn_changes" >> "$GITHUB_STEP_SUMMARY"
          cat "$reasons" >> "$GITHUB_STEP_SUMMARY"

  detect-ios-work-changes:
    name: Detect iOS work changes
    runs-on: ubuntu-24.04
    outputs:
      has-ios-work-changes: ${{ steps.changes.outputs.has-ios-work-changes }}
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test iOS work change detection
        run: python3 scripts/test_ios_work_change_detection.py
      - name: Check complete iOS work change range
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BASE_SHA: ${{ github.event.before }}
          PUSH_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          has_ios_work_changes=true
          reasons="$RUNNER_TEMP/ios-work-change-reasons"
          : > "$reasons"
          if [[ "$EVENT_NAME" == pull_request ]]; then
            head="$PR_HEAD_SHA"
            base=$(git merge-base "$PR_BASE_SHA" "$head") || base=''
          else
            head="$PUSH_HEAD_SHA"
            base="$PUSH_BASE_SHA"
          fi

          if [[ -n "$base" && ! "$base" =~ ^0+$ ]] &&
             git diff --name-only --no-renames -z "$base" "$head" -- > "$RUNNER_TEMP/ios-work-changed-paths"; then
            has_ios_work_changes=false
            while IFS= read -r -d '' path; do
              case "$path" in
                feature/work/src/ios*/*|feature/work/src/common*/*|feature/work/swift/*|feature/work/build.gradle.kts)
                  has_ios_work_changes=true
                  printf '%s\n' "$path (iOS/shared work source)" >> "$reasons"
                  ;;
                domain/src/commonMain/*/entity/BackgroundWork*|domain/src/commonMain/*/entity/ModelDownload*|domain/src/commonMain/*/entity/*Payload.kt|domain/src/commonMain/*/entity/*WorkOwner.kt|domain/src/commonMain/*/entity/*Progress.kt|domain/src/commonMain/*/entity/*Status.kt|domain/src/commonMain/*/feature/work/*|domain/src/commonMain/*/usecase/generation/*|domain/src/commonMain/*/usecase/downloadable/*|domain/src/commonMain/*/usecase/easydiffusion/Observe*|domain/src/commonMain/*/gateway/RemoteGenerationProgressGateway.kt|presentation/generation/src/commonMain/*/*ActionHandler.kt)
                  has_ios_work_changes=true
                  printf '%s\n' "$path (shared execution contract)" >> "$reasons"
                  ;;
                */src/*Test*/*|*/src/test*/*)
                  ;;
                *.kt|*.kts|*.swift|*.toml|*.properties|*.pbxproj|*.plist|*.entitlements|*.xml)
                  if ! git diff --quiet --no-renames -G 'IosWork|WorkActivity|GenerationActivity|feature[/:]work|[Bb]ackgroundTaskManager|[Bb]ackgroundWorkObserver|[Mm]odelDownloadManager|providerSelectionRevision|BGTask|BackgroundTasks|NSSupportsLiveActivities|background-tasks|\.work\.\*|notification_download_|notification_(running|finish|fail|cancel)_|generation_background_gpu|kotlin[x-]?[._-]?coroutines|koin|kotlin[[:space:]]*=|kotlin\.multiplatform|iosSimulatorArm64|iosArm64' "$base" "$head" -- "$path"; then
                    has_ios_work_changes=true
                    printf '%s\n' "$path (changed iOS work integration)" >> "$reasons"
                  fi
                  ;;
              esac
            done < "$RUNNER_TEMP/ios-work-changed-paths"
          else
            printf '%s\n' 'Change history unavailable; running iOS work tests conservatively.' >> "$reasons"
          fi
          echo "has-ios-work-changes=$has_ios_work_changes" >> "$GITHUB_OUTPUT"
          echo "iOS work changes in $base..$head: $has_ios_work_changes" >> "$GITHUB_STEP_SUMMARY"
          cat "$reasons" >> "$GITHUB_STEP_SUMMARY"

  test-ios-work:
    name: iOS — background work lifecycle
    needs: detect-ios-work-changes
    if: needs.detect-ios-work-changes.outputs.has-ios-work-changes == 'true'
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      - name: Select Xcode 26.2
        run: sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
      - name: Set up JDK 17
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
      - name: Test iOS generation and download execution
        run: ./gradlew :feature:work:iosSimulatorArm64Test --no-daemon
      - name: Upload iOS work test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-work-tests
          path: |
            feature/work/build/reports/tests/iosSimulatorArm64Test/
            feature/work/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: warn

  test-mnn:
    name: MNN — ${{ matrix.platform }} contracts and native tests
    needs: detect-mnn-changes
    if: needs.detect-mnn-changes.outputs.has-mnn-changes == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Apple
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      JOB_DESCRIPTION: >-
        Validates MNN catalog and packaging contracts on Linux, tests the native
        graph and allocator on both platforms, and builds pinned Apple slices
        with Swift ownership, archive and Kotlin/Native storage and host tests on macOS.
        The Apple job also links the shared app framework and builds the iOS host for device and simulator.
    steps:
      - name: Describe MNN checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      # Compose's UIKit bridge links symbols from the iOS 26 SDK.
      - name: Select Xcode 26.2 for Apple builds
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install Apple build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Bootstrap pinned MNN Apple slices
        if: runner.os == 'macOS'
        run: python3 scripts/build_mnn_ios.py --work "$RUNNER_TEMP/mnn-apple"
      - name: Resolve MNN wrapper package
        if: runner.os == 'macOS'
        run: swift package --package-path feature/mnn resolve
      - name: Test MNN Swift ownership and strict archives
        if: runner.os == 'macOS'
        run: swift test --package-path feature/mnn/swift
      - name: Test MNN catalog contract
        if: runner.os == 'Linux'
        run: python3 scripts/test_mnn_catalog_contract.py
      - name: Install MNN packaging unit dependencies
        if: runner.os == 'Linux'
        run: python3 -m pip install flatbuffers==25.9.23 jsonschema==4.25.1
      - name: Test MNN model packaging
        if: runner.os == 'Linux'
        run: python3 scripts/test_mnn_packaging.py
      - name: Test MNN native graph and allocator
        run: python3 scripts/test_mnn_native.py --work "$RUNNER_TEMP/mnn-native-unit"
      - name: Set up JDK 17 for Kotlin/Native tests
        if: runner.os == 'macOS'
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"
      - name: Set up Gradle dependency cache
        if: runner.os == 'macOS'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
      - name: Test MNN iOS storage, model leases and host admission
        if: runner.os == 'macOS'
        run: ./gradlew :data:iosSimulatorArm64Test :feature:mnn:iosSimulatorArm64Test --no-daemon
      - name: Compile and link shared presentation for Apple targets
        if: runner.os == 'macOS'
        run: ./gradlew :presentation:app:linkDebugFrameworkIosArm64 :presentation:app:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS native integration
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project app/ios/iosApp.xcodeproj -scheme Debug -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project app/ios/iosApp.xcodeproj -scheme Debug -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Upload Kotlin/Native test reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mnn-ios-native-tests
          path: |
            data/build/reports/tests/iosSimulatorArm64Test/
            data/build/test-results/iosSimulatorArm64Test/*.xml
            feature/mnn/build/reports/tests/iosSimulatorArm64Test/
            feature/mnn/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: warn

  test-cloud-contracts:
    name: ${{ matrix.name }} — API contracts
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: OpenAI
            provider: OPEN_AI
          - name: AI Horde
            provider: HORDE
          - name: Hugging Face
            provider: HUGGING_FACE
          - name: Stability AI
            provider: STABILITY_AI
          - name: Fal AI
            provider: FAL_AI
          - name: Civitai
            provider: CIVITAI
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      JOB_DESCRIPTION: >-
        Checks consumed routes and wire types against compiled application serializers.
        Cloud providers use current official schemas; Civitai uses the application API document.
    steps:
      - name: Describe API contract checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema parser
        run: python3 -m pip install -r scripts/provider_contracts/requirements.txt
      - name: Check schema comparison logic
        run: python3 scripts/test_provider_contract_checker.py
      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}
      - name: Export compiled provider wire contracts
        run: ./gradlew :network:exportProviderContracts --no-daemon
      - name: Test provider and integration API contracts
        run: python3 scripts/test_provider_contracts.py --provider "${{ matrix.provider }}"
      - name: Upload API contract report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-provider-contracts-${{ matrix.provider }}
          path: |
            build/reports/provider-contracts/
            network/build/provider-contracts/models.json
          if-no-files-found: warn

  test-feature:
    name: Main — all Kotlin unit tests, lint, architecture and Codecov
    runs-on: ubuntu-24.04
    env:
      JOB_DESCRIPTION: >-
        Lints Kotlin sources, checks presentation architecture and runs the complete Android/JVM unit suite,
        generates aggregate JaCoCo coverage and uploads it to Codecov.
    steps:
      - name: Describe main checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"

      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Test KDoc formatting on the complete change range
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -m unittest discover -s scripts/kdoc -p 'test_kdoc_*.py'
          python3 scripts/kdoc/test_kdoc_formatting.py --event "$GITHUB_EVENT_PATH"

      - name: Set up JDK 17
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Set up Gradle dependency cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' && github.ref != 'refs/heads/develop' }}

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Lint Kotlin sources
        run: ./gradlew kotlinLint --no-daemon

      - name: Upload Kotlin lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-lint-reports
          path: build/reports/kotlinLint/
          if-no-files-found: ignore

      - name: Check presentation architecture
        run: ./gradlew checkPresentationArchitecture --no-daemon

      - name: Test generation progress contracts
        run: python3 scripts/test_generation_progress_contracts.py

      - name: Test release build selection
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py'

      - name: Run unit tests and generate coverage
        run: ./gradlew clean ciCoverage --no-daemon

      - name: Upload unit-test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-coverage
          path: |
            build/reports/jacoco/ciCoverage/
            **/build/reports/tests/test*UnitTest/
            **/build/test-results/test*UnitTest/*.xml
          if-no-files-found: warn

      - name: Verify coverage report
        run: test -s build/reports/jacoco/ciCoverage/ciCoverage.xml

      # Public fork and Dependabot PRs use Codecov's tokenless public-PR uploads.
      # Keep this on pull_request; untrusted PR code must never receive base-repo secrets.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' && format('pr{0}:{1}', github.event.pull_request.number, github.head_ref) || '' }}
          files: build/reports/jacoco/ciCoverage/ciCoverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: android-unit
          name: android-jvm-unit-tests
