name: Project Tests

on:
  pull_request:
    branches: [master, develop]
  push:
    branches: [master, develop]
    paths-ignore:
      - "docs/docs/**"

permissions:
  contents: read

jobs:
  test-mnn:
    name: MNN — ${{ matrix.platform }} contracts and native tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            runner: ubuntu-24.04
          - platform: Apple
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    env:
      JOB_DESCRIPTION: >-
        Validates MNN catalog and packaging contracts on Linux, tests the native
        graph and allocator on both platforms, and builds pinned Apple slices
        with Swift ownership, archive and Kotlin/Native storage and host tests on macOS.
        The Apple job also links the shared app framework and builds the iOS host for device and simulator.
    steps:
      - name: Describe MNN checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      # Compose's UIKit bridge links symbols from the iOS 26 SDK.
      - name: Select Xcode 26.2 for Apple builds
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Install Apple build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Bootstrap pinned MNN Apple slices
        if: runner.os == 'macOS'
        run: python3 scripts/build_mnn_ios.py --work "$RUNNER_TEMP/mnn-apple"
      - name: Resolve MNN wrapper package
        if: runner.os == 'macOS'
        run: swift package --package-path feature/mnn resolve
      - name: Test MNN Swift ownership and strict archives
        if: runner.os == 'macOS'
        run: swift test --package-path feature/mnn/swift
      - name: Test MNN catalog contract
        if: runner.os == 'Linux'
        run: python3 scripts/test_mnn_catalog_contract.py
      - name: Install MNN packaging unit dependencies
        if: runner.os == 'Linux'
        run: python3 -m pip install flatbuffers==25.9.23 jsonschema==4.25.1
      - name: Test MNN model packaging
        if: runner.os == 'Linux'
        run: python3 scripts/test_mnn_packaging.py
      - name: Test MNN native graph and allocator
        run: python3 scripts/test_mnn_native.py --work "$RUNNER_TEMP/mnn-native-unit"
      - name: Set up JDK 17 for Kotlin/Native tests
        if: runner.os == 'macOS'
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"
      - name: Test MNN iOS storage, model leases and host admission
        if: runner.os == 'macOS'
        run: ./gradlew :data:iosSimulatorArm64Test :feature:mnn:iosSimulatorArm64Test --no-daemon
      - name: Compile and link shared presentation for Apple targets
        if: runner.os == 'macOS'
        run: ./gradlew :presentation:app:linkDebugFrameworkIosArm64 :presentation:app:linkDebugFrameworkIosSimulatorArm64 --no-daemon
      - name: Build iOS native integration
        if: runner.os == 'macOS'
        run: |
          xcodebuild -project app/ios/iosApp.xcodeproj -scheme Debug -configuration Debug -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build
          xcodebuild -project app/ios/iosApp.xcodeproj -scheme Debug -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Upload Kotlin/Native test reports
        if: always() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: mnn-ios-native-tests
          path: |
            data/build/reports/tests/iosSimulatorArm64Test/
            data/build/test-results/iosSimulatorArm64Test/*.xml
            feature/mnn/build/reports/tests/iosSimulatorArm64Test/
            feature/mnn/build/test-results/iosSimulatorArm64Test/*.xml
          if-no-files-found: warn

  test-openai:
    name: OpenAI — compatible API and OAuth contracts
    runs-on: ubuntu-24.04
    env:
      JOB_DESCRIPTION: >-
        Validates the documented OpenAI-compatible image API and ChatGPT OAuth contracts.
    steps:
      - name: Describe OpenAI checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      - name: Test OpenAI-compatible API contract
        run: python3 scripts/test_openai_compatible_contract.py
      - name: Test OpenAI OAuth API contract
        run: python3 scripts/test_openai_oauth_contract.py

  test-easy-diffusion:
    name: Easy Diffusion — API contract
    runs-on: ubuntu-24.04
    env:
      JOB_DESCRIPTION: >-
        Validates the documented Easy Diffusion API contract.
    steps:
      - name: Describe Easy Diffusion checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          persist-credentials: false
      - name: Test Easy Diffusion API contract
        run: python3 scripts/test_easy_diffusion_contract.py

  test-feature:
    name: Main — all Kotlin unit tests, lint, architecture and Codecov
    runs-on: ubuntu-24.04
    env:
      JOB_DESCRIPTION: >-
        Lints Kotlin sources, checks presentation architecture and runs the complete Android/JVM unit suite,
        generates aggregate JaCoCo coverage and uploads it to Codecov.
    steps:
      - name: Describe main checks
        run: printf '%s\n' "$JOB_DESCRIPTION" >> "$GITHUB_STEP_SUMMARY"
      - name: Checkout code
        uses: actions/checkout@v4.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v3.13.0
        with:
          distribution: "adopt"
          java-version: "17"

      - name: Grant execute permissions for gradlew
        run: chmod +x ./gradlew

      - name: Lint Kotlin sources
        run: ./gradlew kotlinLint --no-daemon

      - name: Upload Kotlin lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-lint-reports
          path: build/reports/kotlinLint/
          if-no-files-found: ignore

      - name: Check presentation architecture
        run: ./gradlew checkPresentationArchitecture --no-daemon

      - name: Run unit tests and generate coverage
        run: ./gradlew clean ciCoverage --no-daemon

      - name: Upload unit-test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-jvm-test-coverage
          path: |
            build/reports/jacoco/ciCoverage/
            **/build/reports/tests/test*UnitTest/
            **/build/test-results/test*UnitTest/*.xml
          if-no-files-found: warn

      - name: Verify coverage report
        run: test -s build/reports/jacoco/ciCoverage/ciCoverage.xml

      # Public fork and Dependabot PRs use Codecov's tokenless public-PR uploads.
      # Keep this on pull_request; untrusted PR code must never receive base-repo secrets.
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          override_branch: ${{ github.actor == 'dependabot[bot]' && github.event_name == 'pull_request' && format('pr{0}:{1}', github.event.pull_request.number, github.head_ref) || '' }}
          files: build/reports/jacoco/ciCoverage/ciCoverage.xml
          disable_search: true
          fail_ci_if_error: true
          flags: android-unit
          name: android-jvm-unit-tests
