name: Update Dokka

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      target_branch:
        description: Branch to update (empty uses the branch selected above).
        type: string
        default: ""
      force:
        description: Regenerate even when Dokka inputs are unchanged.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    name: Check documentation inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_updates: ${{ steps.plan.outputs.has_updates }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts

      - name: Inspect documentation inputs
        id: plan
        env:
          SHOULD_FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
          IS_MANUAL: ${{ github.event_name == 'workflow_dispatch' }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          set -euo pipefail
          branches=(master develop)
          quiet_minutes=10
          if [[ "${IS_MANUAL}" == "true" ]]; then
            git check-ref-format "refs/heads/${TARGET_BRANCH}"
            branches=("${TARGET_BRANCH}")
            quiet_minutes=0
          fi
          for branch in "${branches[@]}"; do
            git fetch --no-tags --depth=1 origin \
              "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          done
          args=(--quiet-minutes "${quiet_minutes}")
          if [[ "${SHOULD_FORCE}" == "true" ]]; then
            args+=(--force)
          fi
          python3 scripts/dokka.py plan "${args[@]}" -- "${branches[@]}"

  generate:
    name: Update ${{ matrix.branch }} documentation
    needs: plan
    if: needs.plan.outputs.has_updates == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    # macOS keeps iOS source sets available, matching local documentation builds.
    runs-on: macos-15
    timeout-minutes: 45
    concurrency:
      group: dokka-${{ matrix.branch }}
      cancel-in-progress: false
    env:
      TARGET_BRANCH: ${{ matrix.branch }}
      SOURCE_SHA: ${{ matrix.sha }}
      INPUT_DIGEST: ${{ matrix.digest }}
    steps:
      - name: Require an authorized documentation writer
        env:
          DOKKA_PUSH_TOKEN: ${{ secrets.DOKKA_PUSH_TOKEN }}
        run: |
          if [[ -z "${DOKKA_PUSH_TOKEN}" ]]; then
            echo "::error::Configure DOKKA_PUSH_TOKEN with Contents write access and permission to push to the target branch. See DOCUMENTATION.md."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          token: ${{ secrets.DOKKA_PUSH_TOKEN }}

      # Keep automation available even when the target branch predates it.
      - name: Checkout workflow tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .dokka-automation
          sparse-checkout: scripts
          persist-credentials: false

      - name: Check whether the planned source is still current
        id: current
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          if [[ "$(git rev-parse FETCH_HEAD)" == "${SOURCE_SHA}" ]]; then
            echo "should_generate=true" >> "${GITHUB_OUTPUT}"
          else
            echo "::notice::Branch advanced; rerun manually or wait for the next master/develop scheduled check."
          fi

      - uses: actions/setup-java@v4
        if: steps.current.outputs.should_generate == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.current.outputs.should_generate == 'true'

      - name: Install the configured Android platform
        if: steps.current.outputs.should_generate == 'true'
        run: |
          set -euo pipefail
          compile_sdk="$(sed -n 's/^compileSdk = "\([0-9]*\)"/\1/p' gradle/libs.versions.toml)"
          [[ "${compile_sdk}" =~ ^[0-9]+$ ]]
          sdkmanager "platforms;android-${compile_sdk}"

      - uses: gradle/actions/setup-gradle@v4
        if: steps.current.outputs.should_generate == 'true'

      - name: Regenerate the complete API reference
        if: steps.current.outputs.should_generate == 'true'
        run: |
          set -euo pipefail
          # Remove obsolete pages for deleted/renamed declarations.
          rm -rf docs/docs
          ./gradlew dokkaGeneratePublicationHtml --no-daemon
          python3 .dokka-automation/scripts/dokka.py record "${INPUT_DIGEST}"

      - name: Commit documentation to its source branch
        if: steps.current.outputs.should_generate == 'true'
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "refs/heads/${TARGET_BRANCH}"
          if [[ "$(git rev-parse FETCH_HEAD)" != "${SOURCE_SHA}" ]]; then
            echo "::notice::Branch advanced during generation; rerun manually or wait for the next master/develop scheduled check."
            exit 0
          fi
          git add --all -- docs/docs
          if git diff --cached --quiet; then
            echo "Generated documentation is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: regenerate Dokka"
          # A racing merge rejects this normal push; never overwrite branch history.
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}"
