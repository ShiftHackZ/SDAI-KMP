name: Android Full Nightly

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or SHA to build.
        required: true
        default: develop
      force:
        description: Build even when no functional files changed since the previous nightly.
        required: true
        type: boolean
        default: false
      publish:
        description: Publish or update the public nightly GitHub prerelease.
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

concurrency:
  group: android-full-nightly
  cancel-in-progress: false

env:
  APK_NAME: sdai-full-nightly.apk
  NIGHTLY_TAG: nightly
  NIGHTLY_RELEASE_NAME: Android Full Nightly

jobs:
  nightly:
    name: Build Android full nightly
    runs-on: ubuntu-24.04
    environment: android-release
    timeout-minutes: 90
    env:
      TARGET_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'develop' }}
      FORCE_NIGHTLY: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      PUBLISH_NIGHTLY: ${{ github.event_name != 'workflow_dispatch' || inputs.publish }}

    steps:
      - name: Checkout target ref
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.target_ref || 'develop' }}
          fetch-depth: 0
          submodules: recursive

      - name: Check whether a nightly is needed
        id: plan
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force origin "refs/tags/${NIGHTLY_TAG}:refs/tags/${NIGHTLY_TAG}" || true

          target_sha="$(git rev-parse HEAD)"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

          if ! git rev-parse --verify "${NIGHTLY_TAG}^{commit}" >/dev/null 2>&1; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "reason=No previous nightly tag exists." >> "${GITHUB_OUTPUT}"
            {
              echo "### Android full nightly"
              echo
              echo "No previous nightly tag exists. Building ${target_sha}."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          if [[ "${FORCE_NIGHTLY}" == "true" ]]; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "reason=Manual force build was requested." >> "${GITHUB_OUTPUT}"
            {
              echo "### Android full nightly"
              echo
              echo "Manual force build requested for ${target_sha}."
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git diff --name-only "${NIGHTLY_TAG}..HEAD" > "${RUNNER_TEMP}/nightly-changed-files.txt"

          functional_pattern='^(app/|core/|data/|demo/|domain/|feature/|network/|presentation/|storage/|build-logic/|gradle/|build\.gradle\.kts$|settings\.gradle\.kts$|gradle\.properties$|gradlew$|gradlew\.bat$|\.github/workflows/nightly_android\.yml$)'
          if grep -Eq "${functional_pattern}" "${RUNNER_TEMP}/nightly-changed-files.txt"; then
            echo "should_build=true" >> "${GITHUB_OUTPUT}"
            echo "reason=Functional files changed since the previous nightly." >> "${GITHUB_OUTPUT}"
          else
            echo "should_build=false" >> "${GITHUB_OUTPUT}"
            echo "reason=Only documentation, website, or repository metadata changed since the previous nightly." >> "${GITHUB_OUTPUT}"
          fi

          {
            echo "### Android full nightly"
            echo
            echo "Target ref: \`${TARGET_REF}\`"
            echo "Target commit: \`${target_sha}\`"
            echo "Decision: \`$(grep '^should_build=' "${GITHUB_OUTPUT}" | tail -n 1 | cut -d= -f2)\`"
            echo
            echo "Changed files since \`${NIGHTLY_TAG}\`:"
            echo
            # Backticks in Markdown are literal.
            # shellcheck disable=SC2016
            sed -n '1,100{s/^/- `/;s/$/`/;p;}' "${RUNNER_TEMP}/nightly-changed-files.txt"
            changed_count="$(wc -l < "${RUNNER_TEMP}/nightly-changed-files.txt")"
            if (( changed_count > 100 )); then
              echo
              echo "Showing the first 100 of ${changed_count} changed files."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up JDK 17
        if: steps.plan.outputs.should_build == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.plan.outputs.should_build == 'true'
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare nightly version
        if: steps.plan.outputs.should_build == 'true'
        id: version
        shell: bash
        run: |
          set -euo pipefail

          build_date="$(date -u +%Y%m%d)"
          short_sha="$(git rev-parse --short=8 HEAD)"
          version_suffix="-dev.${build_date}.${short_sha}"
          version_name="$(awk -F '"' '/^versionName = / { print $2; exit }' gradle/libs.versions.toml)${version_suffix}"
          # Seconds since 2020; reruns receive newer codes without changing source files.
          version_code="$(( $(date -u +%s) - 1577836800 ))"
          {
            echo "build_date=${build_date}"
            echo "version_suffix=${version_suffix}"
            echo "version_name=${version_name}"
            echo "version_code=${version_code}"
          } >> "${GITHUB_OUTPUT}"

      - name: Build unsigned full dev APK
        if: steps.plan.outputs.should_build == 'true'
        shell: bash
        env:
          NIGHTLY_VERSION_SUFFIX: ${{ steps.version.outputs.version_suffix }}
          NIGHTLY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          ./gradlew :app:assembleFullDev \
            --no-daemon \
            -PsdaiDevVersionSuffix="${NIGHTLY_VERSION_SUFFIX}" \
            -PsdaiDevVersionCode="${NIGHTLY_VERSION_CODE}" \
            -Dkotlin.native.ignoreDisabledTargets=true \
            -Pkotlin.native.ignoreDisabledTargets=true

      - name: Sign APK with release JKS
        if: steps.plan.outputs.should_build == 'true'
        id: sign
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
          ANDROID_RELEASE_CERT_SHA256: ${{ vars.ANDROID_RELEASE_CERT_SHA256 }}
          NIGHTLY_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          NIGHTLY_VERSION_CODE: ${{ steps.version.outputs.version_code }}
        run: |
          set -euo pipefail

          : "${ANDROID_RELEASE_KEYSTORE_BASE64:?Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret.}"
          : "${ANDROID_RELEASE_STORE_PASSWORD:?Missing ANDROID_RELEASE_STORE_PASSWORD secret.}"
          : "${ANDROID_RELEASE_KEY_ALIAS:?Missing ANDROID_RELEASE_KEY_ALIAS secret.}"
          : "${ANDROID_RELEASE_CERT_SHA256:?Missing ANDROID_RELEASE_CERT_SHA256 variable.}"
          export ANDROID_RELEASE_KEY_PASSWORD="${ANDROID_RELEASE_KEY_PASSWORD:-${ANDROID_RELEASE_STORE_PASSWORD}}"

          unsigned_apk="$(find app/android/build/outputs/apk/full/dev -type f -name '*-unsigned.apk' -print -quit)"
          if [[ -z "${unsigned_apk}" ]]; then
            echo "Could not find unsigned full dev APK." >&2
            find app/android/build/outputs/apk/full/dev -type f -print >&2 || true
            exit 1
          fi

          # Match the stable release signer and its certificate report format.
          build_tools="${ANDROID_HOME}/build-tools/35.0.0"
          apksigner="${build_tools}/apksigner"
          zipalign="${build_tools}/zipalign"
          if [[ ! -x "${apksigner}" || ! -x "${zipalign}" ]]; then
            echo "Android Build Tools 35.0.0 are required for nightly signing." >&2
            exit 1
          fi

          # Refuse to publish a stable-package APK or mismatched build metadata.
          apk_metadata="$("${build_tools}/aapt" dump badging "${unsigned_apk}" | sed -n '1p')"
          if [[ "${apk_metadata}" != *"name='com.shifthackz.aisdv1.app.full.dev'"* ||
                "${apk_metadata}" != *"versionCode='${NIGHTLY_VERSION_CODE}'"* ||
                "${apk_metadata}" != *"versionName='${NIGHTLY_VERSION_NAME}'"* ]]; then
            echo "Nightly APK package or version does not match the requested build." >&2
            exit 1
          fi

          signing_dir="${RUNNER_TEMP}/nightly-signing"
          trap 'rm -rf -- "${signing_dir}"' EXIT
          output_dir="${RUNNER_TEMP}/nightly-output"
          install -m 700 -d "${signing_dir}" "${output_dir}"

          keystore="${signing_dir}/release.jks"
          aligned_apk="${output_dir}/sdai-full-nightly-aligned.apk"
          signed_apk="${output_dir}/${APK_NAME}"

          printf "%s" "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"

          "${zipalign}" -p -f 4 "${unsigned_apk}" "${aligned_apk}"

          "${apksigner}" sign --ks "${keystore}" --ks-key-alias "${ANDROID_RELEASE_KEY_ALIAS}" \
            --ks-pass env:ANDROID_RELEASE_STORE_PASSWORD --key-pass env:ANDROID_RELEASE_KEY_PASSWORD \
            --out "${signed_apk}" "${aligned_apk}"
          "${apksigner}" verify --print-certs "${signed_apk}" | tee "${output_dir}/apksigner.txt"

          expected_cert="$(printf '%s' "${ANDROID_RELEASE_CERT_SHA256}" | tr -d '[:space:]:' | tr '[:upper:]' '[:lower:]')"
          actual_cert="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "${output_dir}/apksigner.txt" | tr '[:upper:]' '[:lower:]')"
          if [[ ! "${expected_cert}" =~ ^[0-9a-f]{64}$ || "${actual_cert}" != "${expected_cert}" ]]; then
            echo "Signed APK certificate does not match the release certificate." >&2
            printf 'Expected SHA-256: %s\nParsed SHA-256: %s\n' "${expected_cert}" "${actual_cert}" >&2
            exit 1
          fi

          sha256sum "${signed_apk}" > "${output_dir}/${APK_NAME}.sha256"
          {
            echo "signed_apk=${signed_apk}"
            echo "sha256_file=${output_dir}/${APK_NAME}.sha256"
            echo "apksigner_report=${output_dir}/apksigner.txt"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare nightly release notes
        if: steps.plan.outputs.should_build == 'true'
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          output_dir="${RUNNER_TEMP}/nightly-output"
          release_notes="${output_dir}/release-notes.md"
          target_sha="${{ steps.plan.outputs.target_sha }}"
          version_name="${{ steps.version.outputs.version_name }}"
          version_code="${{ steps.version.outputs.version_code }}"
          apk_sha256="$(cut -d ' ' -f 1 "${{ steps.sign.outputs.sha256_file }}")"
          cert_sha256="$(awk -F': ' '/Signer #1 certificate SHA-256 digest:/ { print $2; exit }' "${{ steps.sign.outputs.apksigner_report }}")"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${NIGHTLY_TAG}/${APK_NAME}"

          if git rev-parse --verify "${NIGHTLY_TAG}^{commit}" >/dev/null 2>&1; then
            git log --no-merges --format='- %s' -n 5 "${NIGHTLY_TAG}..HEAD" | cut -c 1-200 > "${output_dir}/changes.txt"
          else
            git log --format='- %s' -n 1 HEAD | cut -c 1-200 > "${output_dir}/changes.txt"
          fi

          cat > "${release_notes}" <<EOF
          Automated Android full nightly build.

          - Target ref: \`${TARGET_REF}\`
          - Commit: \`${target_sha}\`
          - Version: \`${version_name} (${version_code})\`
          - Application ID: \`com.shifthackz.aisdv1.app.full.dev\`
          - APK SHA-256: \`${apk_sha256}\`
          - Signing certificate SHA-256: \`${cert_sha256}\`

          This is a prerelease build from the moving \`${NIGHTLY_TAG}\` tag. It is not a Play Store, F-Droid, or stable project release.
          It installs as SDAI Dev alongside stable SDAI, with separate settings and history.
          EOF

          {
            echo
            echo "Recent changes:"
            echo
            cat "${output_dir}/changes.txt"
          } >> "${release_notes}"

          echo "release_notes=${release_notes}" >> "${GITHUB_OUTPUT}"
          {
            echo "### Nightly artifact"
            echo
            echo "Static APK URL: ${download_url}"
            echo "APK SHA-256: \`${apk_sha256}\`"
            echo "Signing certificate SHA-256: \`${cert_sha256}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Publish GitHub prerelease
        if: steps.plan.outputs.should_build == 'true' && env.PUBLISH_NIGHTLY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          target_sha="${{ steps.plan.outputs.target_sha }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${NIGHTLY_TAG}" "${target_sha}"
          git push --force origin "refs/tags/${NIGHTLY_TAG}"

          if gh release view "${NIGHTLY_TAG}" >/dev/null 2>&1; then
            while IFS= read -r asset_name; do
              case "${asset_name}" in
                "${APK_NAME}"|"${APK_NAME}.sha256") ;;
                *) gh release delete-asset "${NIGHTLY_TAG}" "${asset_name}" --yes ;;
              esac
            done < <(gh release view "${NIGHTLY_TAG}" --json assets --jq '.assets[].name')

            gh release upload "${NIGHTLY_TAG}" \
              "${{ steps.sign.outputs.signed_apk }}" \
              "${{ steps.sign.outputs.sha256_file }}" \
              --clobber
            gh release edit "${NIGHTLY_TAG}" \
              --title "${NIGHTLY_RELEASE_NAME}" \
              --notes-file "${{ steps.metadata.outputs.release_notes }}" \
              --prerelease
          else
            gh release create "${NIGHTLY_TAG}" \
              "${{ steps.sign.outputs.signed_apk }}" \
              "${{ steps.sign.outputs.sha256_file }}" \
              --title "${NIGHTLY_RELEASE_NAME}" \
              --notes-file "${{ steps.metadata.outputs.release_notes }}" \
              --prerelease \
              --verify-tag
          fi

      - name: Announce nightly on Discord
        if: steps.plan.outputs.should_build == 'true' && env.PUBLISH_NIGHTLY == 'true'
        shell: bash
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_NIGHTLY_WEBHOOK_URL }}
          NIGHTLY_VERSION_NAME: ${{ steps.version.outputs.version_name }}
          NIGHTLY_BUILD_DATE: ${{ steps.version.outputs.build_date }}
          NIGHTLY_COMMIT: ${{ steps.plan.outputs.target_sha }}
        run: |
          set -euo pipefail

          if [[ -z "${DISCORD_WEBHOOK_URL}" ]]; then
            echo "::notice::Discord notification skipped: DISCORD_NIGHTLY_WEBHOOK_URL is not configured."
            exit 0
          fi

          output_dir="${RUNNER_TEMP}/nightly-output"
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/tag/${NIGHTLY_TAG}"
          download_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${NIGHTLY_TAG}/${APK_NAME}"
          jq -n \
            --arg version "${NIGHTLY_VERSION_NAME}" \
            --arg date "${NIGHTLY_BUILD_DATE}" \
            --arg commit "${NIGHTLY_COMMIT}" \
            --arg release_url "${release_url}" \
            --arg download_url "${download_url}" \
            --arg commit_url "https://github.com/${GITHUB_REPOSITORY}/commit/${NIGHTLY_COMMIT}" \
            --arg run_url "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg feedback_url "https://github.com/${GITHUB_REPOSITORY}/issues" \
            --rawfile changes "${output_dir}/changes.txt" \
            '{allowed_mentions: {parse: []}, embeds: [{
              title: ("SDAI Dev · Nightly · " + $date),
              url: $release_url,
              color: 7684269,
              description: ("**" + $version + "**\nInstalls alongside stable SDAI with separate app data.\n\n" +
                $changes[:1000] + "\n[Download latest APK](" + $download_url + ") · [Release details](" + $release_url +
                ")\n[Commit " + $commit[:8] + "](" + $commit_url + ") · [Build](" + $run_url +
                ") · [Report an issue](" + $feedback_url + ")"),
              footer: {text: "Preview build for testing. The download link always serves the latest nightly."}
            }]}' > "${output_dir}/discord.json"

          # Do not retry POST automatically: a lost response could duplicate the announcement.
          curl --fail --silent --show-error --connect-timeout 15 --max-time 60 \
            --header 'Content-Type: application/json' \
            --data-binary "@${output_dir}/discord.json" \
            --output "${output_dir}/discord-response.json" \
            --url-query 'wait=true' \
            "${DISCORD_WEBHOOK_URL}"
